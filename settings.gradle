rootProject.name = 'CAF'
include 'core', 'desktop'

if(!file('arc/settings.gradle.kts').isFile()){
    throw new GradleException('Run git submodule update --init --recursive first.')
}
includeBuild('arc'){
    dependencySubstitution{
        substitute(module('com.github.caliniya.Arc:arc-core')).using(project(':arc-core'))
        substitute(module('com.github.caliniya.Arc:backend-sdl3')).using(project(':backends:backend-sdl3'))
        substitute(module('com.github.caliniya.Arc:natives-desktop')).using(project(':natives:natives-desktop'))
    }
}
